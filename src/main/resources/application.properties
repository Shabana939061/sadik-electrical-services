# ===================================================================
# SADIK ELECTRICAL SERVICES - APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=sadik-electrical-services
server.port=8080

# Active Profile (defaults to mysql, switch to h2 for standalone local test without mysql)
spring.profiles.active=mysql

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Multipart / File Upload limit
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.sadik.electrical=INFO
logging.level.org.springframework.security=INFO
