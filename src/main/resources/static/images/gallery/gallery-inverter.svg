<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gBg3)"/>
  
  <!-- Inverter Trolley Setup -->
  <g transform="translate(120, 50)">
    <!-- Trolley Frame -->
    <rect x="0" y="40" width="360" height="280" rx="14" fill="#0F172A" stroke="#0077B6" stroke-width="3"/>
    
    <!-- Top Inverter -->
    <rect x="40" y="60" width="280" height="80" rx="8" fill="#1E293B" stroke="#00B4D8" stroke-width="2"/>
    <rect x="60" y="80" width="70" height="35" rx="4" fill="#000000"/>
    <text x="95" y="102" font-family="monospace" font-size="14" fill="#10B981" font-weight="700" text-anchor="middle">ECO 1100</text>
    <circle cx="160" cy="98" r="6" fill="#10B981"/>
    <circle cx="180" cy="98" r="6" fill="#FFB703"/>

    <!-- Bottom Tall Tubular Battery -->
    <rect x="30" y="170" width="300" height="130" rx="10" fill="#1E293B" stroke="#FFB703" stroke-width="2"/>
    <rect x="60" y="155" width="20" height="15" fill="#E63946"/>
    <rect x="280" y="155" width="20" height="15" fill="#000000"/>

    <!-- Heavy Cables -->
    <path d="M 70 155 C 70 140 50 120 40 100" stroke="#E63946" stroke-width="6" fill="none"/>
    <path d="M 290 155 C 290 140 310 120 320 100" stroke="#000000" stroke-width="6" fill="none"/>
  </g>

  <!-- Badge -->
  <rect x="60" y="380" width="260" height="40" rx="20" fill="rgba(11, 25, 44, 0.9)" stroke="#FFB703" stroke-width="1.5"/>
  <text x="190" y="405" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">PURE SINE WAVE BACKUP SETUP</text>
</svg>
