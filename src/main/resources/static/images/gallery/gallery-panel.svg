<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#152A4A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gBg4)"/>
  
  <!-- 3-Phase Industrial / Commercial Distribution Board -->
  <g transform="translate(100, 40)">
    <rect x="0" y="0" width="400" height="320" rx="14" fill="#E2E8F0" stroke="#0077B6" stroke-width="4"/>
    <rect x="15" y="15" width="370" height="290" rx="10" fill="#0F172A"/>
    
    <!-- Top Row: 4-Pole RCCB & Isolator -->
    <rect x="35" y="35" width="80" height="70" rx="4" fill="#334155" stroke="#00B4D8" stroke-width="2"/>
    <rect x="50" y="45" width="50" height="35" rx="3" fill="#E63946"/>
    <text x="75" y="68" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">MAIN 63A</text>

    <!-- Phase Indicators R Y B -->
    <circle cx="150" cy="70" r="14" fill="#E63946" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="190" cy="70" r="14" fill="#FFB703" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="230" cy="70" r="14" fill="#0077B6" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Middle & Bottom Rows: Mini MCB Bank -->
    <g transform="translate(35, 130)">
      <rect x="0" y="0" width="330" height="60" rx="4" fill="#1E293B"/>
      <!-- Individual Circuit Breakers -->
      <rect x="15" y="10" width="22" height="40" rx="2" fill="#0077B6"/>
      <rect x="45" y="10" width="22" height="40" rx="2" fill="#0077B6"/>
      <rect x="75" y="10" width="22" height="40" rx="2" fill="#0077B6"/>
      <rect x="105" y="10" width="22" height="40" rx="2" fill="#FFB703"/>
      <rect x="135" y="10" width="22" height="40" rx="2" fill="#FFB703"/>
      <rect x="165" y="10" width="22" height="40" rx="2" fill="#FFB703"/>
      <rect x="195" y="10" width="22" height="40" rx="2" fill="#10B981"/>
      <rect x="225" y="10" width="22" height="40" rx="2" fill="#10B981"/>
      <rect x="255" y="10" width="22" height="40" rx="2" fill="#10B981"/>
      <rect x="285" y="10" width="22" height="40" rx="2" fill="#CBD5E1"/>
    </g>

    <g transform="translate(35, 210)">
      <rect x="0" y="0" width="330" height="60" rx="4" fill="#1E293B"/>
      <rect x="15" y="10" width="22" height="40" rx="2" fill="#0077B6"/>
      <rect x="45" y="10" width="22" height="40" rx="2" fill="#0077B6"/>
      <rect x="75" y="10" width="22" height="40" rx="2" fill="#FFB703"/>
      <rect x="105" y="10" width="22" height="40" rx="2" fill="#FFB703"/>
      <rect x="135" y="10" width="22" height="40" rx="2" fill="#10B981"/>
      <rect x="165" y="10" width="22" height="40" rx="2" fill="#10B981"/>
    </g>
  </g>

  <!-- Badge -->
  <rect x="60" y="380" width="260" height="40" rx="20" fill="rgba(11, 25, 44, 0.9)" stroke="#00B4D8" stroke-width="1.5"/>
  <text x="190" y="405" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">3-PHASE COMMERCIAL DB BOARD</text>
</svg>
