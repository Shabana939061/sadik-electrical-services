<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gBg5)"/>
  
  <g transform="translate(150, 70)">
    <!-- Circuit Fault Diagnosis -->
    <circle cx="150" cy="130" r="110" fill="#152A4A" stroke="#FFB703" stroke-width="4"/>
    
    <!-- Spark & Danger Symbol -->
    <polygon points="150,40 230,190 70,190" fill="#FFB703" stroke="#0B192C" stroke-width="3"/>
    <polygon points="155,75 135,130 155,130 145,170 175,120 155,120" fill="#0B192C"/>

    <circle cx="210" cy="80" r="25" fill="#E63946" stroke="#FFFFFF" stroke-width="2"/>
    <text x="210" y="87" font-family="'Outfit', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle">!</text>
  </g>

  <!-- Badge -->
  <rect x="60" y="380" width="280" height="40" rx="20" fill="rgba(11, 25, 44, 0.9)" stroke="#E63946" stroke-width="1.5"/>
  <text x="200" y="405" font-family="'Outfit', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">EMERGENCY SHORT CIRCUIT REPAIR</text>
</svg>
