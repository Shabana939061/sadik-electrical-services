<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem: Shield + Electric Lightning -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="#0B192C"/>
    <path d="M 30 10 L 48 18 C 48 35 30 50 30 50 C 30 50 12 35 12 18 Z" fill="none" stroke="url(#blueGrad)" stroke-width="2.5"/>
    <!-- Lightning Bolt -->
    <polygon points="32,15 20,33 29,33 26,45 40,27 31,27" fill="url(#yellowGrad)"/>
  </g>
  
  <!-- Text Brand -->
  <text x="82" y="38" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">
    SADIK <tspan fill="#FFB703">ELECTRICAL</tspan>
  </text>
  <text x="82" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" letter-spacing="1.5">
    SERVICES • CHILAKALURIPET
  </text>
</svg>
