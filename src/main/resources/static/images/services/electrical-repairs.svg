<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#152A4A"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="blue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2)"/>
  
  <g transform="translate(180, 80)">
    <!-- Electrician Tools: Crossed Wrench & Screwdriver -->
    <circle cx="120" cy="110" r="100" fill="#1E3E62" stroke="url(#blue2)" stroke-width="3" stroke-dasharray="8,4"/>
    
    <!-- Screwdriver -->
    <g transform="rotate(45, 120, 110)">
      <rect x="114" y="20" width="12" height="110" rx="3" fill="#E2E8F0"/>
      <rect x="110" y="130" width="20" height="60" rx="5" fill="#E63946"/>
      <polygon points="120,10 114,20 126,20" fill="#94A3B8"/>
    </g>

    <!-- Wrench -->
    <g transform="rotate(-45, 120, 110)">
      <rect x="113" y="30" width="14" height="150" rx="4" fill="url(#blue2)"/>
      <path d="M 110 30 C 95 30 95 10 120 10 C 145 10 145 30 130 30 Z" fill="url(#blue2)"/>
      <circle cx="120" cy="170" r="7" fill="#0B192C"/>
    </g>

    <!-- Central Lightning Spark -->
    <polygon points="124,70 108,115 120,115 116,150 136,105 124,105" fill="url(#gold2)" filter="drop-shadow(0 0 10px #FFB703)"/>
    
    <text x="120" y="260" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">TROUBLESHOOTING &amp; REPAIRS</text>
  </g>
</svg>
