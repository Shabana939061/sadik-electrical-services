<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <linearGradient id="lightGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB703" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3)"/>
  
  <g transform="translate(150, 40)">
    <!-- Ceiling Fan Rod & Motor -->
    <rect x="145" y="0" width="10" height="60" fill="#94A3B8"/>
    <ellipse cx="150" cy="70" rx="35" ry="18" fill="#0077B6" stroke="#00B4D8" stroke-width="2"/>
    
    <!-- Fan Blades -->
    <path d="M 115 70 C 50 65 20 85 10 95 C 40 105 90 85 115 75 Z" fill="#00B4D8" opacity="0.9"/>
    <path d="M 185 70 C 250 65 280 85 290 95 C 260 105 210 85 185 75 Z" fill="#00B4D8" opacity="0.9"/>
    <path d="M 150 88 C 150 145 160 185 170 195 C 160 185 140 145 150 88 Z" fill="#00B4D8" opacity="0.8"/>

    <!-- Modern LED Light Fixture / Bulb -->
    <g transform="translate(230, 110)">
      <polygon points="40,20 10,130 70,130" fill="url(#lightGlow)"/>
      <path d="M 30 20 C 30 5 50 5 50 20 C 55 30 50 45 40 45 C 30 45 25 30 30 20 Z" fill="#FFB703"/>
      <line x1="40" y1="45" x2="40" y2="55" stroke="#94A3B8" stroke-width="4"/>
      <!-- Radiating Rays -->
      <circle cx="40" cy="25" r="30" fill="none" stroke="#FFB703" stroke-width="1.5" stroke-dasharray="4,4"/>
    </g>

    <text x="150" y="300" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">FAN &amp; LIGHT INSTALLATION</text>
  </g>
</svg>
