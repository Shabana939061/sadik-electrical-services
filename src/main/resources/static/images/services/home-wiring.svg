<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg1)"/>
  
  <!-- Subtle Circuit Lines -->
  <path d="M 50 100 H 200 V 250 H 400 V 150 H 550" stroke="#0077B6" stroke-width="2" stroke-opacity="0.25" fill="none"/>
  <path d="M 100 350 H 280 V 220 H 480 V 320" stroke="#FFB703" stroke-width="2" stroke-opacity="0.2" fill="none"/>
  <circle cx="200" cy="250" r="4" fill="#00B4D8"/>
  <circle cx="400" cy="150" r="4" fill="#FFB703"/>

  <!-- House Outline with Modern Wiring Network -->
  <g transform="translate(150, 70)">
    <!-- House Silhouette -->
    <polygon points="150,20 40,110 70,110 70,250 230,250 230,110 260,110" fill="#152A4A" stroke="url(#accent1)" stroke-width="4"/>
    <!-- Roof highlight -->
    <polyline points="30,115 150,20 270,115" stroke="url(#gold1)" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Distribution Board & Cables -->
    <rect x="90" y="150" width="40" height="55" rx="4" fill="#0B192C" stroke="url(#gold1)" stroke-width="2"/>
    <line x1="95" y1="165" x2="125" y2="165" stroke="#00B4D8" stroke-width="3"/>
    <line x1="95" y1="175" x2="125" y2="175" stroke="#FFB703" stroke-width="3"/>
    <line x1="95" y1="185" x2="125" y2="185" stroke="#E63946" stroke-width="3"/>

    <!-- Conduit Cables Routing -->
    <path d="M 110 150 V 110 H 200 V 170" stroke="#00B4D8" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
    <circle cx="200" cy="170" r="14" fill="#FFB703" fill-opacity="0.2" stroke="#FFB703" stroke-width="2"/>
    <!-- Plug Symbol -->
    <circle cx="200" cy="170" r="4" fill="#FFB703"/>
    
    <text x="150" y="285" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">COMPLETE HOME WIRING</text>
  </g>
</svg>
