<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#1E3E62"/>
    </linearGradient>
    <linearGradient id="invGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg5)"/>
  
  <g transform="translate(140, 70)">
    <!-- Inverter Unit (Top) -->
    <rect x="30" y="20" width="260" height="90" rx="10" fill="url(#invGrad)" stroke="#00B4D8" stroke-width="3"/>
    <!-- Digital Display -->
    <rect x="50" y="40" width="80" height="40" rx="6" fill="#000000" stroke="#0077B6" stroke-width="1.5"/>
    <text x="90" y="65" font-family="'Courier New', monospace" font-size="16" font-weight="700" fill="#10B981" text-anchor="middle">230V OK</text>
    <!-- Indicators -->
    <circle cx="160" cy="55" r="5" fill="#10B981"/>
    <circle cx="180" cy="55" r="5" fill="#FFB703"/>
    <circle cx="200" cy="55" r="5" fill="#00B4D8"/>
    <!-- Power Button -->
    <circle cx="250" cy="55" r="14" fill="#0077B6"/>
    <circle cx="250" cy="55" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Tubular Heavy Duty Battery (Bottom) -->
    <rect x="10" y="140" width="300" height="120" rx="12" fill="#1E293B" stroke="#FFB703" stroke-width="3"/>
    <!-- Battery Terminals -->
    <rect x="50" y="125" width="24" height="15" rx="3" fill="#E63946"/>
    <rect x="245" y="125" width="24" height="15" rx="3" fill="#0F172A"/>
    <!-- Floating Level Indicators -->
    <circle cx="110" cy="132" r="6" fill="#FFB703"/>
    <circle cx="145" cy="132" r="6" fill="#FFB703"/>
    <circle cx="180" cy="132" r="6" fill="#FFB703"/>
    <circle cx="215" cy="132" r="6" fill="#FFB703"/>
    
    <!-- Heavy Cable Connection -->
    <path d="M 62 125 C 62 90 40 80 30 65" stroke="#E63946" stroke-width="5" fill="none"/>
    <path d="M 257 125 C 257 95 285 85 290 65" stroke="#0F172A" stroke-width="5" fill="none"/>

    <text x="160" y="295" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">INVERTER &amp; BATTERY INSTALLATION</text>
  </g>
</svg>
