<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="100%" stop-color="#152A4A"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg6)"/>
  
  <g transform="translate(180, 60)">
    <!-- Safety Shield Graphic -->
    <path d="M 120 20 L 210 50 C 210 140 120 210 120 210 C 120 210 30 140 30 50 Z" fill="#1E3E62" stroke="url(#shieldGrad)" stroke-width="4"/>
    
    <!-- Digital Multimeter Inside Shield -->
    <rect x="75" y="60" width="90" height="120" rx="10" fill="#FFB703" stroke="#0B192C" stroke-width="3"/>
    <rect x="85" y="75" width="70" height="35" rx="4" fill="#0F172A"/>
    <text x="120" y="98" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#00B4D8" text-anchor="middle">239.5 V</text>
    <circle cx="120" cy="135" r="14" fill="#0B192C"/>
    
    <!-- Probes / Test Leads -->
    <path d="M 95 180 C 80 210 40 190 30 160" stroke="#E63946" stroke-width="3" fill="none"/>
    <path d="M 145 180 C 160 210 200 190 210 160" stroke="#000000" stroke-width="3" fill="none"/>

    <text x="120" y="270" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">SAFETY AUDIT &amp; MAINTENANCE</text>
  </g>
</svg>
