<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - Sadik Electrical Services</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background: linear-gradient(135deg, #0B192C 0%, #152A4A 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 rounded-4 shadow-lg overflow-hidden bg-white">
                    <!-- Card Top Header -->
                    <div class="p-4 text-center" style="background-color: #07101C; border-bottom: 2px solid #0077B6;">
                        <img th:src="@{/images/logo.svg}" alt="Sadik Electrical Services" height="42" class="mb-2">
                        <div class="text-warning small fw-bold text-uppercase letter-spacing-1">
                            <i class="bi bi-shield-lock-fill"></i> Secure Admin Management
                        </div>
                    </div>

                    <div class="card-body p-4 p-md-4">
                        <div class="text-center mb-4">
                            <h4 class="fw-bold text-dark mb-1">Admin Sign In</h4>
                            <p class="text-muted small mb-0">Authorized personnel only</p>
                        </div>

                        <!-- Login Error Alert -->
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show small py-2 px-3" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-1"></i> Invalid username or password.
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Logout Success Alert -->
                        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show small py-2 px-3" role="alert">
                            <i class="bi bi-check-circle-fill me-1"></i> You have logged out successfully.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Login Form -->
                        <form th:action="@{/admin/login}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="mb-3">
                                <label for="username" class="form-label small fw-bold">Admin Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person-fill"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label small fw-bold">Admin Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-electric w-100 py-2 fw-bold mb-3 shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                            </button>
                        </form>

                        <!-- Seed Credentials Quick Hint -->
                        <div class="p-3 rounded-3 bg-light border text-center small text-muted">
                            <div><i class="bi bi-key-fill text-warning me-1"></i> Default Setup Credentials:</div>
                            <div class="fw-bold text-dark mt-1">Username: <code>admin</code> | Password: <code>admin123</code></div>
                        </div>

                        <div class="text-center mt-3">
                            <a th:href="@{/}" class="text-muted small text-decoration-none">
                                <i class="bi bi-arrow-left me-1"></i> Back to Public Website
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
