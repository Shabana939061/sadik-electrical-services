<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Services - Sadik Electrical Services</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Admin & Main CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">

<div class="admin-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/admin-sidebar :: sidebar('services')}"></div>

    <div class="admin-main">
        <!-- Header -->
        <header class="admin-header">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-dark d-lg-none" id="sidebarToggle" type="button">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <div>
                    <h4 class="mb-0 fw-bold" style="color: #0B192C;">Manage Electrical Services</h4>
                    <small class="text-muted">Configure service catalog, descriptions, and pricing</small>
                </div>
            </div>
            <div>
                <button type="button" class="btn btn-yellow btn-sm fw-bold" data-bs-toggle="modal" data-bs-target="#addServiceModal">
                    <i class="bi bi-plus-circle me-1"></i> Add New Service
                </button>
            </div>
        </header>

        <main class="admin-content">
            <!-- Flash Message Alerts -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4 border-0 shadow-sm" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4 border-0 shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Services Table Card -->
            <div class="admin-table-card">
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Service Name</th>
                                <th>Short Description</th>
                                <th>Starting Price</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="srv : ${services}">
                                <td>
                                    <div class="service-card-icon mb-0" style="width: 36px; height: 36px; font-size: 1.1rem;">
                                        <i class="bi" th:classappend="${srv.icon}"></i>
                                    </div>
                                </td>
                                <td>
                                    <div class="fw-bold text-dark" th:text="${srv.name}">Home Wiring</div>
                                    <small class="text-muted font-monospace" th:text="${srv.slug}">home-wiring</small>
                                </td>
                                <td>
                                    <div class="text-muted small text-truncate" style="max-width: 300px;" th:text="${srv.shortDescription}">
                                        Short description
                                    </div>
                                </td>
                                <td>
                                    <span class="fw-bold text-dark font-monospace">₹<span th:text="${#numbers.formatDecimal(srv.priceStarting, 0, 'COMMA', 0, 'POINT')}">1499</span></span>
                                </td>
                                <td>
                                    <span th:if="${srv.active}" class="badge bg-success-subtle text-success border border-success-subtle fw-bold">Active</span>
                                    <span th:unless="${srv.active}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">Inactive</span>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <!-- Edit Modal Trigger -->
                                        <button type="button" class="btn btn-outline-primary"
                                                title="Edit Service"
                                                data-bs-toggle="modal" data-bs-target="#editServiceModal"
                                                th:data-service-id="${srv.id}"
                                                th:data-service-name="${srv.name}"
                                                th:data-service-short="${srv.shortDescription}"
                                                th:data-service-desc="${srv.description}"
                                                th:data-service-icon="${srv.icon}"
                                                th:data-service-image="${srv.image}"
                                                th:data-service-price="${srv.priceStarting}"
                                                th:data-service-order="${srv.displayOrder}"
                                                th:data-service-active="${srv.active}">
                                            <i class="bi bi-pencil"></i>
                                        </button>

                                        <!-- Toggle Status Form -->
                                        <form th:action="@{'/admin/services/' + ${srv.id} + '/toggle'}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-secondary" th:title="${srv.active ? 'Deactivate' : 'Activate'}">
                                                <i class="bi" th:classappend="${srv.active ? 'bi-eye-slash' : 'bi-eye'}"></i>
                                            </button>
                                        </form>

                                        <!-- Delete Service Form -->
                                        <form th:action="@{'/admin/services/' + ${srv.id} + '/delete'}" method="post" class="d-inline"
                                              onsubmit="return confirm('Are you sure you want to delete this service?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-danger" title="Delete Service">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal: Add New Service -->
<div class="modal fade" id="addServiceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header bg-dark text-white border-0 py-3">
                <h5 class="modal-title fw-bold">Add New Electrical Service</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/services/new}" th:object="${newService}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Service Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Solar Inverter Setup" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Bootstrap Icon Class *</label>
                            <input type="text" th:field="*{icon}" class="form-control" placeholder="bi-sun-fill" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Starting Price (₹) *</label>
                            <input type="number" step="0.01" th:field="*{priceStarting}" class="form-control" placeholder="499.00" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Display Order</label>
                            <input type="number" th:field="*{displayOrder}" class="form-control" value="8">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Image URL / Path</label>
                            <input type="text" th:field="*{image}" class="form-control" placeholder="/images/services/electrical-repairs.svg">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Short Description *</label>
                            <input type="text" th:field="*{shortDescription}" class="form-control" placeholder="Brief 1-sentence summary" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Detailed Description *</label>
                            <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Full service scope and specifications..." required></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{active}" id="addServiceActive" checked>
                                <label class="form-check-label small fw-bold" for="addServiceActive">Active (Visible to public)</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 bg-light">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-electric btn-sm fw-bold">Save New Service</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal: Edit Existing Service -->
<div class="modal fade" id="editServiceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header bg-dark text-white border-0 py-3">
                <h5 class="modal-title fw-bold">Edit Service Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="editServiceForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Service Name *</label>
                            <input type="text" class="form-control" id="editServiceName" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Bootstrap Icon Class *</label>
                            <input type="text" class="form-control" id="editServiceIcon" name="icon" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Starting Price (₹) *</label>
                            <input type="number" step="0.01" class="form-control" id="editServicePrice" name="priceStarting" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Display Order</label>
                            <input type="number" class="form-control" id="editServiceOrder" name="displayOrder">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Image URL / Path</label>
                            <input type="text" class="form-control" id="editServiceImage" name="image">
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Short Description *</label>
                            <input type="text" class="form-control" id="editServiceShort" name="shortDescription" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Detailed Description *</label>
                            <textarea class="form-control" id="editServiceDesc" name="description" rows="3" required></textarea>
                        </div>
                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="editServiceActive" name="active">
                                <label class="form-check-label small fw-bold" for="editServiceActive">Active (Visible to public)</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 bg-light">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-electric btn-sm fw-bold">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Admin Custom JS -->
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
