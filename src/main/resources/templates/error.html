<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Error')}"></head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{fragments/header :: navbar('error')}"></div>

    <section class="py-5 min-vh-100 d-flex align-items-center">
        <div class="container py-5 text-center">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5">
                    <div class="card border-0 rounded-4 shadow-lg p-5 bg-white">
                        <div class="rounded-circle bg-warning bg-opacity-25 text-dark d-inline-flex align-items-center justify-content-center mb-4 mx-auto" style="width: 80px; height: 80px; font-size: 2.5rem;">
                            <i class="bi bi-exclamation-triangle-fill text-warning"></i>
                        </div>

                        <h1 class="display-3 fw-bold text-dark mb-1" th:text="${statusCode != null ? statusCode : '404'}">404</h1>
                        <h4 class="fw-bold mb-3" style="color: #0B192C;">Something Went Off Circuit</h4>
                        
                        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The requested page was not found or an unexpected error occurred.'}">
                            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                        </p>

                        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                            <a th:href="@{/}" class="btn btn-yellow fw-bold px-4 py-2">
                                <i class="bi bi-house-door-fill me-1"></i> Return Home
                            </a>
                            <a th:href="@{/booking}" class="btn btn-electric fw-bold px-4 py-2">
                                <i class="bi bi-calendar-check-fill me-1"></i> Book a Service
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Floating WhatsApp & Mobile Sticky Call Bar -->
    <div th:replace="~{fragments/floating-buttons :: floatingControls}"></div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
