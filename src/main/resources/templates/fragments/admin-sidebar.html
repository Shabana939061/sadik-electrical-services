<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(activeAdminNav)" class="admin-sidebar">
    <div class="admin-sidebar-brand">
        <i class="bi bi-shield-fill-check text-warning fs-4"></i>
        <div>
            <div class="fw-bold" style="font-size: 1rem; line-height: 1.2;">Sadik Electrical</div>
            <div class="text-secondary small fw-normal">Admin Control Panel</div>
        </div>
    </div>

    <ul class="admin-sidebar-menu">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeAdminNav == 'dashboard' ? 'active' : ''}" th:href="@{/admin/dashboard}">
                <i class="bi bi-grid-1x2-fill"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeAdminNav == 'bookings' ? 'active' : ''}" th:href="@{/admin/bookings}">
                <i class="bi bi-calendar-check-fill"></i> Manage Bookings
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeAdminNav == 'services' ? 'active' : ''}" th:href="@{/admin/services}">
                <i class="bi bi-tools"></i> Manage Services
            </a>
        </li>
        <li class="nav-item mt-3 pt-2 border-top border-secondary border-opacity-25">
            <a class="nav-link text-warning" th:href="@{/}" target="_blank">
                <i class="bi bi-box-arrow-up-right"></i> View Live Website
            </a>
        </li>
    </ul>

    <div class="admin-sidebar-footer">
        <div class="d-flex align-items-center justify-content-between mb-2">
            <div class="small text-light-50">
                <i class="bi bi-person-circle text-info me-1"></i>
                <span class="fw-semibold" th:text="${adminUsername != null ? adminUsername : 'Admin'}">Admin</span>
            </div>
            <span class="badge bg-success small">Online</span>
        </div>
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="btn btn-outline-danger btn-sm w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </form>
    </div>
</div>
</body>
</html>
