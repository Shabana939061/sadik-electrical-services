<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Sadik Electrical Services | Chilakaluripet'">Sadik Electrical Services</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
<div th:fragment="navbar(activeNav)">
    <!-- Top Contact Bar -->
    <div class="bg-dark text-light py-2 border-bottom border-secondary border-opacity-25 d-none d-md-block" style="background-color: #07101C !important; font-size: 0.88rem;">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-4">
                <span><i class="bi bi-geo-alt-fill text-warning me-1"></i> Chilakaluripet, Andhra Pradesh, India</span>
                <span><i class="bi bi-clock-fill text-info me-1"></i> Mon - Sun: 7:00 AM - 10:00 PM (24/7 Emergency)</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <a href="tel:7993777432" class="text-light text-decoration-none fw-semibold">
                    <i class="bi bi-telephone-fill text-warning me-1"></i> +91 7993777432
                </a>
                <span class="text-secondary">|</span>
                <a href="https://wa.me/917993777432?text=Hello%20Sadik%20Electrical%20Services,%20I%20need%20electrical%20services" 
                   target="_blank" class="text-success text-decoration-none fw-semibold">
                    <i class="bi bi-whatsapp me-1"></i> WhatsApp
                </a>
                <span class="text-secondary" sec:authorize="isAuthenticated()">|</span>
                <a th:href="@{/admin/dashboard}" sec:authorize="isAuthenticated()" class="text-warning text-decoration-none fw-bold">
                    <i class="bi bi-speedometer2 me-1"></i> Admin Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- Main Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark ses-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/images/logo.svg}" alt="Sadik Electrical Services" height="46">
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#sesNavbar" aria-controls="sesNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="sesNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeNav == 'home' ? 'active' : ''}" th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeNav == 'about' ? 'active' : ''}" th:href="@{/about}">
                            <i class="bi bi-info-circle me-1"></i> About Us
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeNav == 'services' ? 'active' : ''}" th:href="@{/services}">
                            <i class="bi bi-lightning-charge me-1"></i> Services
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeNav == 'gallery' ? 'active' : ''}" th:href="@{/gallery}">
                            <i class="bi bi-images me-1"></i> Gallery
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activeNav == 'contact' ? 'active' : ''}" th:href="@{/contact}">
                            <i class="bi bi-telephone me-1"></i> Contact
                        </a>
                    </li>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a class="btn btn-yellow btn-sm py-2 px-3 fw-bold" th:href="@{/booking}">
                            <i class="bi bi-calendar-check-fill me-1"></i> Book a Service
                        </a>
                    </li>
                    <li class="nav-item ms-lg-1 mt-2 mt-lg-0" sec:authorize="!isAuthenticated()">
                        <a class="btn btn-outline-white btn-sm py-2 px-2" th:href="@{/admin/login}" title="Admin Login">
                            <i class="bi bi-shield-lock-fill"></i>
                        </a>
                    </li>
                    <li class="nav-item ms-lg-1 mt-2 mt-lg-0" sec:authorize="isAuthenticated()">
                        <form th:action="@{/admin/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm py-2 px-2" title="Logout">
                                <i class="bi bi-box-arrow-right"></i>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
